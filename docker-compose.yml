version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ucar-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Mk123456@Abc
      - MSSQL_PID=Developer
    ports:
      - "1439:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ucar-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Mk123456@Abc -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ucar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucar-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1439;Database=UCarDB;User Id=sa;Password=Mk123456@Abc;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ucar-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local

networks:
  ucar-network:
    driver: bridge
  